# ~/.tmux.conf  (symlinked from ~/dotfiles/tmux.conf)

# 마우스 지원 (스크롤/창 선택/리사이즈)
set -g mouse on

# 복사 모드에서 vi 키 바인딩 (h/j/k/l 이동, v 선택, y 복사, / 검색)
setw -g mode-keys vi

# 상태바 커스텀 (Chelsea 로열 블루)
set -g status-interval 5
set -g status-style "bg=#034694,fg=#ffffff"
set -g status-left "#[fg=#ffffff,bold] CFC 🦁 #[default]"
set -g status-right "#[fg=#ffffff] %Y-%m-%d %H:%M "

# 패널 경계선 (활성=하늘색, 비활성=기본값, 굵은 선)
set -g pane-active-border-style "fg=#87cefa"
set -g pane-border-lines heavy
